name: Gerar IPA para Sideloadly (iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compilar IPA no macOS Cloud
    runs-on: macos-14

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configurar Projeto e Assinatura iOS
        run: |
          cd mobile
          flutter create --platforms=ios --org com.multistore.app .
          flutter pub get

          # Desativar a exigência de certificado pago no Xcode para permitir build unsigned para Sideloadly
          python3 -c "
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              data = f.read()
          data = data.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = \"\";')
          with open(path, 'w') as f:
              f.write(data)
          print('Assinatura desativada com sucesso no project.pbxproj')
          "

          echo 'CODE_SIGNING_ALLOWED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGNING_REQUIRED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGN_IDENTITY=' >> ios/Flutter/Release.xcconfig

      - name: Compilar App iOS Unsigned
        run: |
          cd mobile
          flutter build ios --release --no-codesign || {
            echo 'Finalizando via xcodebuild sem assinatura...'
            cd ios
            xcodebuild -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath ../build/ios_derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          }

      - name: Empacotar arquivo .IPA para Sideloadly
        run: |
          mkdir -p Payload
          RUNNER_APP=$(find mobile/build -name "Runner.app" -type d | head -n 1)
          echo "Runner.app localizado em: $RUNNER_APP"
          if [ -z "$RUNNER_APP" ]; then
            echo "Erro: Runner.app não foi localizado no diretório de build!"
            exit 1
          fi
          cp -R "$RUNNER_APP" Payload/
          zip -r MultiStore-App.ipa Payload
          ls -lh MultiStore-App.ipa

      - name: Disponibilizar arquivo .IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: MultiStore-iPhone-IPA
          path: MultiStore-App.ipa
          retention-days: 7
